<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pedidos de la cafetería</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/cafeteria.css">
  <script src="pedidos.js" defer></script>

</head>
<body>
   <nav class="navbar navbar-cafe mb-4">
    <div class="container">
      <span class="navbar-brand mb-0 h1 text-white">Cafetería · Registro de pedidos</span>
    </div>
  </nav>
 
  <main class="container pb-5" style="max-width: 900px;">
    <div class="d-flex flex-column gap-4">
 
      <!-- Pedidos registrados -->
      <section class="card">
        <div class="card-body">
          <h2 class="h5 mb-3">Pedidos registrados</h2>
 
          <div class="row g-2 align-items-end mb-3">
            <div class="col-sm-4">
              <label for="precioMaximo" class="form-label mb-1">Precio máximo</label>
              <input type="number" id="precioMaximo" class="form-control" step="0.01" min="0" placeholder="Ej. 3.00">
            </div>
            <div class="col-sm-8 d-flex flex-wrap gap-2">
              <button type="button" id="btnFiltrar" class="btn btn-filtro">Filtrar productos</button>
              <button type="button" id="btnMostrarTodos" class="btn btn-filtro">Mostrar todos</button>
              <button type="button" id="btnLimpiar" class="btn btn-peligro ms-sm-auto">Limpiar pedidos</button>
            </div>
          </div>
 
          <div class="table-responsive">
            <table class="table table-striped table-hover align-middle mb-0">
              <thead>
                <tr>
                  <th>Producto</th>
                  <th class="text-end">Precio unitario</th>
                  <th class="text-end">Cantidad</th>
                  <th class="text-end">Subtotal</th>
                </tr>
              </thead>
              <tbody id="cuerpoTabla"></tbody>
            </table>
          </div>
 
          <div class="totales d-flex flex-wrap justify-content-between gap-2 mt-3 pt-3">
            <span>Total de unidades: <strong id="totalUnidades">0</strong></span>
            <span>Monto total: <strong id="montoTotal">$0.00</strong></span>
          </div>
        </div>
      </section>
 
      <!-- Nuevo pedido -->
      <section class="card">
        <div class="card-body">
          <h2 class="h5 mb-3">Nuevo pedido</h2>
          <form id="formPedido" novalidate>
            <div class="row g-3">
              <div class="col-md-6">
                <label for="producto" class="form-label">Producto</label>
                <input type="text" id="producto" class="form-control" placeholder="Café americano" required>
              </div>
              <div class="col-md-3 col-6">
                <label for="precio" class="form-label">Precio unitario</label>
                <input type="number" id="precio" class="form-control" step="0.01" min="0" placeholder="2.50" required>
              </div>
              <div class="col-md-3 col-6">
                <label for="cantidad" class="form-label">Cantidad</label>
                <input type="number" id="cantidad" class="form-control" step="1" min="1" placeholder="3" required>
              </div>
            </div>
            <div id="mensajeError" class="alert alert-danger py-2 mt-3 mb-0 d-none" role="alert"></div>
            <button type="submit" id="btnAgregar" class="btn btn-cafe w-100 mt-3">Agregar pedido</button>
          </form>
        </div>
      </section>
 
    </div>
  </main>
 
  <script src="pedidos.js"></script>
</body>
</html>
